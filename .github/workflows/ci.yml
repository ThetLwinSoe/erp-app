name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  analyze-test:
    name: Flutter – analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml only pins the Dart SDK (environment.sdk), not a Flutter
      # version, so flutter-version-file can't resolve one from it. .metadata
      # tracks the stable channel, so install latest stable directly instead.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
