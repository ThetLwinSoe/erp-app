name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

jobs:
  analyze-test:
    name: Flutter – analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml only pins the Dart SDK (environment.sdk), not a Flutter
      # version, so flutter-version-file can't resolve one from it, and plain
      # channel:stable floats to whatever is newest on the day the job runs -
      # which can introduce analyzer findings a locally-tested older SDK
      # never saw. Pin the exact version developers are actually running
      # locally instead, and bump this deliberately when upgrading Flutter.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
