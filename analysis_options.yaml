# This file configures the analyzer for the Flutter project.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - prefer_single_quotes
    - sort_child_properties_last

analyzer:
  errors:
    invalid_annotation_target: ignore
    # Style/migration debt, not bugs - tracked separately from the CI gate.
    # withOpacity -> withValues is a mechanical rename across ~40 call
    # sites; not worth doing as a drive-by here.
    deprecated_member_use: ignore
    unnecessary_string_interpolations: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
